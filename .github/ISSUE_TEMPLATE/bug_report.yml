name: Bug report
description: Report reproducible behavior that is not working as intended
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, raw tokens, transfer tickets, encryption keys, URL fragments, SDP/ICE payloads, or plaintext file contents.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Commit SHA, branch, or release version.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include commands, API calls, or UI steps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Go version, Node.js version, browser, deployment mode.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or output
      render: shell
    validations:
      required: false
