name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/recipient/package-lock.json

      - name: Install recipient frontend dependencies
        working-directory: web/recipient
        run: npm ci --ignore-scripts

      - name: Build recipient frontend
        working-directory: web/recipient
        run: npm run build

      - name: Check Go formatting
        run: |
          if [ -n "$(gofmt -l ./cmd ./internal)" ]; then
            gofmt -l ./cmd ./internal
            echo "gofmt required"
            exit 1
          fi

      - name: Run Go tests
        run: go test ./...

      - name: Collect Go coverage
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage.txt
          python3 scripts/coverage_badge.py coverage.txt .github/badges/coverage.svg

      - name: Check coverage badge is current
        run: |
          git ls-files --error-unmatch .github/badges/coverage.svg
          git diff --exit-code .github/badges/coverage.svg

      - name: Run focused Go race tests
        run: go test -race ./internal/agentd ./internal/auth ./internal/agents ./internal/sessions ./internal/api ./internal/audit ./internal/db ./internal/signaling ./internal/p2p

      - name: Run Go vet
        run: go vet ./...

      - name: Build Go commands
        run: go build ./cmd/server ./cmd/agentd ./cmd/postamat

      - name: Smoke-check Compose deployment config
        run: docker compose --env-file deployments/.env.example -f deployments/compose.yaml config
